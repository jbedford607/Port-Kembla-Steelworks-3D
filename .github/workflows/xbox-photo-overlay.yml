name: Build Xbox Green photo overlay demo
on:
  push:
    branches: [xbox-photo-overlay-demo]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile installable APK
        working-directory: android-demo
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          test -s android-demo/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android-demo/app/build/outputs/apk/debug/app-debug.apk | tail -2
      - uses: actions/upload-artifact@v4
        with:
          name: Xbox-Green-Demo-APK
          path: android-demo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
