name: Build S24 Assistant APK
on:
  push:
    branches: [s24-assistant-build]
    paths:
      - 'S24Assistant_Project.tar.xz'
      - '.github/workflows/build-s24-assistant.yml'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          if [ -z "$SDKMANAGER" ]; then echo "SDK manager absent"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack app
        run: mkdir -p S24Assistant && tar -xJf S24Assistant_Project.tar.xz -C S24Assistant
      - name: Build debug APK
        run: |
          sed -i 's/setTextAllCaps(/setAllCaps(/g' S24Assistant/app/src/main/java/com/localaxis/assistant/MainActivity.java
          cd S24Assistant && gradle --no-daemon assembleDebug
      - name: Publish APK
        run: |
          mkdir -p releases
          cp S24Assistant/app/build/outputs/apk/debug/app-debug.apk releases/S24Assistant.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/S24Assistant.apk
          git commit -m 'Built S24 assistant APK [skip ci]'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: S24Assistant-APK
          path: releases/S24Assistant.apk
