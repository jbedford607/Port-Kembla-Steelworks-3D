name: Xbox Classic S24 — build APK
on:
  push:
    branches:
      - build/xbox-classic-s24-launcher
  pull_request:
    branches:
      - build/xbox-classic-s24-launcher
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
      - name: Unpack source
        run: |
          base64 --decode .xbox-build/source.tar.xz.base64 | tar -xJ
          test -f Xbox_Classic_S24_Launcher/app/src/main/AndroidManifest.xml
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK on GitHub runner
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          test -x "$SDK/cmdline-tools/16.0/bin/sdkmanager"
      - name: Install SDK 35
        run: "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
      - name: Configure Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile Android debug APK
        working-directory: Xbox_Classic_S24_Launcher
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Xbox-Classic-S24-Launcher-v02-APK
          path: Xbox_Classic_S24_Launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
