name: Build Xbox Phone fullscreen 3D launcher
on:
  push:
    branches: [xbox-phone-s24]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Attempt to include real ogxweb WebAssembly assets
        working-directory: android-app
        continue-on-error: true
        run: python3 mirror_ogxweb.py
      - name: Compile Android Home launcher
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK file
        run: |
          test -s android-app/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android-app/app/build/outputs/apk/debug/app-debug.apk | tail -2
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep 'classes.dex'
      - uses: actions/upload-artifact@v4
        with:
          name: Xbox-Phone-S24-Fullscreen-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
